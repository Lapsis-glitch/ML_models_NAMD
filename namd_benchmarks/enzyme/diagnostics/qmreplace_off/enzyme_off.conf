# ===========================================================================
# NAMD3 full-ML enzyme benchmark — templated config.
# The WHOLE solvated enzyme droplet is the QM/ML region (beta=1 for every atom);
# qmReplaceAll on, so the FeNNiX (or other) engine supplies ALL forces and NAMD's
# own MM forces are discarded.  Finite, non-periodic cluster (no PBC / PME) — the
# system.prmtop has its box stripped, matching the fixed-shape FeNNiX export.
# Placeholders are substituted by run_enzyme.sh.
# ===========================================================================

amber                   yes
parmfile                /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/systems/mono_shell5/system.prmtop
coordinates             /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/systems/mono_shell5/system.pdb
temperature             300

# --- output / timing -------------------------------------------------------
binaryoutput            no
outputname              bench_off
outputenergies          5
outputtiming            5
outputpressure          0
binaryrestart           no
restartfreq             1000000
dcdfreq                 1000000

# --- (MM forces are discarded by qmReplaceAll; kept valid for startup) ------
cutoff                  12.0
pairlistdist            14.0
switching               on
switchdist              10.0
exclude                 scaled1-4
1-4scaling              0.833333
rigidbonds              all

# --- thermostat ------------------------------------------------------------
langevin                on
langevintemp            300
langevinHydrogen        on
langevindamping         5

# --- integrator ------------------------------------------------------------
timestep                0.25
firstTimestep           0
stepspercycle           5
fullElectFrequency      1
nonbondedfreq           1

# --- QM / ML-FF engine -----------------------------------------------------
QMForces                on
QMSoftware              fennol
QMExecPath              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/models/fennix_enzyme/mono_shell5/manifest.json
QMColumn                beta
qmParamPDB              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/systems/mono_shell5/qm.pdb
QMBaseDir               /tmp/namd_enzyme_qmmm
QMChargeMode            none
qmBondColumn            occ
QMSimsPerNode           1
qmReplaceAll            off
QMVdWParams             off
qmElecEmbed             off
QMSwitching             off
QMPointChargeScheme     none
QMMult                  1 1
QMCharge                1 0


run                     60
