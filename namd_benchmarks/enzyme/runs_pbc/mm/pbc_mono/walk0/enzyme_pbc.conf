# ===========================================================================
# NAMD3 full-ML enzyme benchmark — PERIODIC (PBC + PME) templated config.
#
# Companion to enzyme.conf.tmpl (the finite-droplet config).  Here the whole
# solvated enzyme sits in a real periodic water box (built by build_enzyme_pbc.py
# with VMD/CHARMM, cell in the .xsc) with PME for the MM electrostatics and
# wrapAll to keep molecules in the cell.  The WHOLE system is still the ML region
# (beta=1 for every atom), driven by FeNNiX.
#
#   NB on physics: the FeNNiX StableHLO graph takes only coordinates (no cell
#   input), so PME/minimum-image reach only the MM bookkeeping — the ML forces
#   themselves are computed on the finite cluster NAMD hands the engine.  The
#   periodic box buys a properly sized, contained hydration shell (no droplet
#   surface tension), not true periodic ML forces.  See README_PBC.md.
#
# CHARMM force field (psf + par_all36) — only used for NAMD start-up/PME, since
# qmReplaceAll replaces every force with the ML potential.
# Placeholders are substituted by run_enzyme_pbc.sh.
# ===========================================================================

# --- structure / coordinates / periodic cell -------------------------------
paraTypeCharmm          on
structure               /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/systems/pbc_mono/system.psf
coordinates             /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/systems/pbc_mono/system.pdb
extendedSystem          /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/systems/pbc_mono/system.xsc
temperature             300

parameters              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/toppar/par_all36_prot.prm
parameters              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/toppar/par_all36_na.prm
parameters              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/toppar/par_all36_carb.prm
parameters              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/toppar/par_all36_lipid.prm
parameters              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/toppar/par_all36_cgenff.prm
parameters              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/toppar/toppar_water_ions_namd.str

# --- output / timing -------------------------------------------------------
binaryoutput            no
outputname              bench
outputenergies          100
outputtiming            100
outputpressure          0
binaryrestart           no
restartfreq             1000000
dcdfreq                 1000000
xstfreq                 1000000
wrapAll                 on
wrapWater               on

# --- nonbonded / PME (periodic) --------------------------------------------
exclude                 scaled1-4
1-4scaling              1.0
cutoff                  14.0
switching               on
switchdist              12.0
pairlistdist            16.0
rigidbonds              all

PME                     on
PMETolerance            1.0e-6
PMEInterpOrder          4
PMEGridSpacing          1.0

# --- thermostat (NVT; Langevin) --------------------------------------------
langevin                on
langevintemp            300
langevinHydrogen        on
langevindamping         5

# --- integrator ------------------------------------------------------------
timestep                2.0
firstTimestep           0
stepspercycle           100
fullElectFrequency      1
nonbondedfreq           1

# --- QM / ML-FF engine (whole system = ML region) --------------------------
QMForces                off
QMSoftware              none
QMExecPath              none
QMColumn                beta
qmParamPDB              /home/rat/PycharmProjects/ML_models_NAMD/namd_benchmarks/enzyme/systems/pbc_mono/qm.pdb
QMBaseDir               /tmp/namd_enzyme_pbc_qmmm
QMChargeMode            none
qmBondColumn            occ
QMSimsPerNode           1
qmReplaceAll            on
QMVdWParams             off
qmElecEmbed             off
QMSwitching             off
QMPointChargeScheme     none
QMMult                  1 1
QMCharge                1 0
minimize                500
reinitvels              300

run                     1000
